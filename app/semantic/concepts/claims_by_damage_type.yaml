name: claims_by_damage_type
description: Claims whose claim_details JSON marks a given damage_type (JSONB text extraction).
params:
  - name: damage_type
    required: true
    type: string
sql: |
  SELECT
    cl.claim_id,
    cl.policy_id,
    cl.status,
    cl.description,
    cl.amount,
    cl.filed_date,
    cl.claim_details,
    cl.claim_details->>'damage_type' AS damage_type,
    cl.claim_details->>'severity' AS severity,
    c.full_name,
    c.customer_id
  FROM claims cl
  JOIN policies p ON p.policy_id = cl.policy_id
  JOIN customers c ON c.customer_id = p.customer_id
  WHERE cl.claim_details->>'damage_type' = %(damage_type)s
  ORDER BY cl.filed_date DESC, cl.claim_id
allowed_roles:
  - adjuster
  - manager
response_fields:
  - claim_id
  - policy_id
  - status
  - description
  - amount
  - filed_date
  - claim_details
  - damage_type
  - severity
  - full_name
  - customer_id
result_mode: many
